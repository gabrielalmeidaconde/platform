# Infra compartilhada no EKS: balanceador (Nginx, Service LoadBalancer),
# Redis (cache) e observabilidade (Prometheus + Grafana). Os microsserviços
# fazem o próprio deploy pelo service.yaml.
# Só roda quando a org tiver EKS_CLUSTER; a AWS é acessada via OIDC assumindo
# a role vars.AWS_ROLE_ARN (sem chave de acesso guardada no GitHub).

name: infra

on:
  push:
    branches: [ main ]
    paths: [ 'k8s/**', 'setup/grafana/**', '.github/workflows/infra.yaml' ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: kubectl apply k8s/
    runs-on: ubuntu-latest
    if: vars.EKS_CLUSTER != ''
    concurrency:
      group: deploy-infra
      cancel-in-progress: false
    env:
      NAMESPACE: ${{ vars.K8S_NAMESPACE || 'store' }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: kubeconfig
        env:
          CLUSTER: ${{ vars.EKS_CLUSTER }}
        run: |
          aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"
          kubectl get namespace "$NAMESPACE" >/dev/null 2>&1 || kubectl create namespace "$NAMESPACE"

      - name: Grafana (dashboards e senha do admin)
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          # dashboards versionados em setup/grafana/dashboards (o mesmo JSON do compose)
          kubectl create configmap grafana-dashboards -n "$NAMESPACE" \
            --from-file=setup/grafana/dashboards/ --dry-run=client -o yaml | kubectl apply -f -
          # senha: secret GRAFANA_ADMIN_PASSWORD da org; sem ele, gera uma aleatória
          # só na primeira vez (kubectl get secret grafana-admin ... para ler)
          if [ -n "$GRAFANA_ADMIN_PASSWORD" ]; then
            kubectl create secret generic grafana-admin -n "$NAMESPACE" \
              --from-literal=password="$GRAFANA_ADMIN_PASSWORD" --dry-run=client -o yaml | kubectl apply -f -
          elif ! kubectl get secret grafana-admin -n "$NAMESPACE" >/dev/null 2>&1; then
            kubectl create secret generic grafana-admin -n "$NAMESPACE" \
              --from-literal=password="$(openssl rand -base64 18)"
          fi

      - name: apply
        run: |
          kubectl apply -n "$NAMESPACE" -f k8s/
          kubectl rollout status deployment/redis -n "$NAMESPACE" --timeout=180s
          kubectl rollout status deployment/lb -n "$NAMESPACE" --timeout=180s
          kubectl rollout status deployment/prometheus -n "$NAMESPACE" --timeout=180s
          # o Grafana não relê o ConfigMap de dashboards sozinho de forma confiável
          kubectl rollout restart deployment/grafana -n "$NAMESPACE"
          kubectl rollout status deployment/grafana -n "$NAMESPACE" --timeout=180s
          kubectl get svc lb -n "$NAMESPACE" -o wide
