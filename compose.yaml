# Plataforma completa rodando localmente.
#   ./scripts/build.sh            # compila os jars (interfaces + serviços)
#   docker compose up -d --build  # sobe tudo; entrada em http://localhost:8080
#
# Só o lb (Nginx) publica porta para fora: gateway, auth, account, exchange,
# redis e db ficam na rede interna do compose (camada confiável). Prometheus
# (9090), Grafana (3000), Kafka UI (8089) e Mailpit (8025) ficam presos ao
# 127.0.0.1 da máquina.

name: store

services:

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER:-store}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-store}
      POSTGRES_DB: ${DB_NAME:-store}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 20

  # Bottleneck: cache. Guarda token -> id da conta para o gateway não chamar
  # o Auth em toda requisição (ver api/gateway-service/.../TokenCache.java)
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20

  account:
    build:
      context: ./api/account-service
      dockerfile: Dockerfile
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_DB: ${DB_NAME:-store}
      DATABASE_USERNAME: ${DB_USER:-store}
      DATABASE_PASSWORD: ${DB_PASSWORD:-store}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    deploy:
      replicas: 1
    depends_on:
      db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  auth:
    build:
      context: ./api/auth-service
      dockerfile: Dockerfile
    environment:
      # segredo vem do .env (scripts/build.sh gera um aleatório); nunca no código
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?defina JWT_SECRET_KEY no .env (veja .env.example)}
      JWT_DURATION: ${JWT_DURATION:-86400000}
    deploy:
      replicas: 1
    depends_on:
      - account

  gateway:
    build:
      context: ./api/gateway-service
      dockerfile: Dockerfile
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # liga/desliga o cache do token (para comparar no teste de carga)
      TOKEN_CACHE_ENABLED: ${TOKEN_CACHE_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:3000,http://localhost:8080}
    # sem "ports": só é alcançável pelo lb
    deploy:
      replicas: ${GATEWAY_REPLICAS:-2}
    depends_on:
      redis:
        condition: service_healthy
      auth:
        condition: service_started
      account:
        condition: service_started

  # Bottleneck: balanceamento de carga (Nginx na frente das réplicas do gateway)
  lb:
    image: nginx:1.29-alpine
    ports:
      - "${LB_PORT:-8080}:80"
    volumes:
      - ./setup/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway

  # Exchange (Python/FastAPI). Cotação da AwesomeAPI com cache em memória
  # (bottleneck: ver docs/bottlenecks/exchange-cache.md)
  exchange:
    build:
      context: ./api/exchange-service
      dockerfile: Dockerfile
    environment:
      CACHE_TTL: ${EXCHANGE_CACHE_TTL:-30}
      EXCHANGE_API_TOKEN: ${EXCHANGE_API_TOKEN:-}
    deploy:
      replicas: ${EXCHANGE_REPLICAS:-1}

  # Bottleneck: mensageria (docs/bottlenecks/messaging.md), como no Hands-on 7.
  # O account grava a conta e o evento AccountCreated na mesma transação
  # (outbox) e um relay publica no tópico account-events; o notification
  # consome, deduplica pelo eventId e manda o e-mail de boas-vindas ao Mailpit.
  # Kafka 4 de um nó em modo KRaft (broker e controlador no mesmo processo).
  # Só a rede interna do compose fala com ele (sem porta publicada).
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # tópicos criados explicitamente pelo kafka-init (o automático teria 1 partição)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 20

  # tarefa única: cria os tópicos e termina. A DLT tem as mesmas 6 partições
  # (o Spring publica a mensagem que falhou no mesmo número de partição)
  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists           --topic account-events --partitions 6 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists           --topic account-events-dlt --partitions 6 --replication-factor 1
    restart: "no"

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    environment:
      KAFKA_CLUSTERS_0_NAME: store
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8089}:8080"
    depends_on:
      kafka:
        condition: service_healthy

  # provedor de e-mail falso (SMTP 1025 na rede interna, caixa de entrada web)
  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

  notification:
    build:
      context: ./api/notification-service
      dockerfile: Dockerfile
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_DB: ${DB_NAME:-store}
      DATABASE_USERNAME: ${DB_USER:-store}
      DATABASE_PASSWORD: ${DB_PASSWORD:-store}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MAIL_HOST: mailpit
      NOTIFY_CONCURRENCY: ${NOTIFY_CONCURRENCY:-3}   # threads consumidoras (no máximo 6 úteis: 6 partições)
      EMAIL_LATENCY: ${EMAIL_LATENCY:-50ms}          # latência simulada do provedor de e-mail
      NOTIFY_IDEMPOTENT: ${NOTIFY_IDEMPOTENT:-true}  # false = sem deduplicação (para ver duplicatas)
    deploy:
      replicas: 1
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  # Bottleneck: observabilidade (docs/bottlenecks/observability.md).
  # Portas só no 127.0.0.1 do host: ferramentas de operação, não da loja.
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      # o k6 (scripts/load-test.sh) envia as métricas do teste por remote write
      - --web.enable-remote-write-receiver
    volumes:
      - ./setup/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - gateway
      - exchange

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/store.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./setup/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./setup/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  db_data:
  kafka_data:
  redis_data:
  prometheus_data:
  grafana_data:
