# Cluster EKS do projeto pna26 (criado com eksctl).
#   criar:  eksctl create cluster -f setup/eks-store.yaml
#   apagar: eksctl delete cluster -f setup/eks-store.yaml --disable-nodegroup-eviction
# Custo aproximado ligado: ~US$ 0,23/h (control plane 0,10 + 2x t3.medium 0,083
# + NAT gateway 0,045). Apagar quando não estiver em uso.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: eks-store
  region: us-east-2
  version: "1.37"        # versão padrão do EKS, em suporte padrão até 11/2027

# eksctl cria uma VPC nova com sub-redes públicas (balanceador) e privadas (nós)
# em 2 zonas. O RDS também exige 2 zonas no subnet group.
availabilityZones: [ us-east-2a, us-east-2b ]
vpc:
  cidr: 10.20.0.0/16
  nat:
    gateway: Single      # 1 NAT só: os nós privados saem para a internet (ECR, APIs) por ele

accessConfig:
  authenticationMode: API   # quem acessa o cluster é definido por access entries

managedNodeGroups:
  - name: ng-store
    instanceType: t3.medium   # 2 vCPU / 4 GiB, até 17 pods por nó
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    volumeSize: 20
    privateNetworking: true   # nós só nas sub-redes privadas, sem IP público
    labels:
      role: store
